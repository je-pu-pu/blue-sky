# ext-1 のステージ（tools/stage_convert/convert_stage.py で ext-1.stage から変換した）
format = 1

[stage]
collision = "ext-1.obj"
ground = "ground"

[player]
position = [-6.0, 1.0, 9.0]

[goal]
position = [0.0, 0.0, 55.0]

[[object]]
type = "static"
model = "stage-ext-1"
position = [0, 0, 0]

[[event]]
when = "start"
then = [
  { do = "set", bgm = "twinkle-ep" },
  { do = "set", sky_box = "star-2" },

  { do = "set", shadow_color = [0.5, 0.5, 1, 1] },
  { do = "set", shadow_paper_color = [1, 1, 1, 1] },
]

# 移動する壁に名前をつける
[[object]]
type = "static"
name = "wall"
model = "wall-3"
position = [0.0, 0.0, 49.3]
rotation = [0, 0, 0]

[[object]]
type = "stone"
position = [21.0, 0.0, 39.0]
direction = 0

[[object]]
type = "robot"
positions = [
  [21.0, 0.0, 36.0],
  [13.0, 0.0, 36.0],
  [21.0, 0.0, 20.0],
]
direction = 180

[[object]]
type = "robot"
position = [21.0, 0.0, 28.0]
direction = 275

[[object]]
type = "robot"
position = [13.0, 0.0, 28.0]
direction = 270

[[object]]
type = "robot"
position = [13.0, 0.0, 20.0]
direction = 270

[[object]]
type = "stone"
position = [21.0, 0.0, 12.0]
direction = 0

[[object]]
type = "robot"
positions = [
  [5.0, 0.0, 20.0],
  [-3.0, 0.0, 20.0],
  [-3.0, 0.0, 28.0],
  [5.0, 0.0, 36.0],
  [1.0, 0.0, 41.0],
]
direction = 180

[[object]]
type = "robot"
position = [3.0, 0.0, 39.0]
direction = 90

[[object]]
type = "robot"
positions = [
  [-1.0, 0.0, 39.0],
  [1.0, 0.0, 37.0],
  [-3.0, 0.0, 36.0],
  [5.0, 0.0, 28.0],
]
direction = 180

# スイッチの設定
[[object]]
type = "switch"
position = [1.0, 0.0, 39.0]
direction = 180
on_turn_on = [
  { do = "move_to", target = "wall", position = [0.0, 4, 49.3], speed = 0.25 },
  { do = "play_sound", sound = "machine-translation-long" },
]

# 死ぬ前に鳴っていたサウンドを止める
[[event]]
when = "start"
then = [
  { do = "stop_sound", sound = "machine-translation-long" },
]
