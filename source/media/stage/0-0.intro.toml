# 0-0 のステージの前の文と背景（tools/stage_convert/convert_story_text.py で 0-0.intro から変換した）
format = 1

[[layer]]
image = "noise.jpg"
rotation = { from = 0, to = 180, speed = 0.1 }
scale = { from = 1.6, to = 3, speed = 0.0001 }

[text]
color = 0xFFFFFFCC
border_color = 0x000000CC
body = """
ある日、少年は空を見上げた。

青く広がる空の向こうに
何かが待っている気がした。

これは、その小さな冒険の物語。

"""
