# ext-0 のステージ（tools/stage_convert/convert_stage.py で ext-0.stage から変換した）
format = 1

[stage]
collision = "ext-0.obj"
ground = "ground"

[player]
position = [0.0, 101.0, -47.0]
camera_direction = 60

[goal]
position = [0.0, 99.0, 40.0]

[[object]]
type = "static"
model = "stage-ext-0"
position = [0, 0, 0]

[[event]]
when = "start"
then = [
  { do = "set", bgm = "road" },
  { do = "set", sky_box = "sky" },
  { do = "set", balloon_sound_type = 3 },

  { do = "set", line_type = 4 },
  { do = "set", paper_type = 4 },
  { do = "set", shadow_color = [0.5, 0.5, 0.25, 0.75] },
]

[[object]]
type = "balloon"
position = [0.0, 70.0, -10.0]
direction = 0

[[object]]
type = "balloon"
positions = [
  [0.0, 80.0, -20.0],
  [0.0, 20.0, 0.0],
  [0.0, 30.0, 0.0],
  [0.0, 40.0, 0.0],
  [0.0, 50.0, 0.0],
