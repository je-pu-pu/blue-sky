# 0-3 のステージ（tools/stage_convert/convert_stage.py で 0-3.stage から変換した）
format = 1

[stage]
ground = "ground"

[player]
position = [0, 500.0, 0]

[goal]
position = [0, 15, 10.0]

[[event]]
when = "start"
then = [
  { do = "set", bgm = "bad-dream" },
  { do = "set", sky_box = "3" },
]

[[event]]
when = "start"
then = [
  { do = "set", drawing_accent_scale = 0 },
  { do = "play_sound", sound = "fall" },
  { do = "set", ambient_color = [1, 1, 1] },

  { do = "load_sound", name = "fin", file = "my-failed-takeoff-2" },
]

[[object]]
type = "medal"
position = [0, 100, 13]
direction = 0

[[object]]
type = "area-switch"
position = [0, 400, 0]
size = [100, 1, 100]
on_turn_on = [
  { do = "fade", ambient_color = [0, 0, 0, 0.01] },
]

[[object]]
type = "area-switch"
position = [0, 300, 0]
size = [100, 1, 100]
on_turn_on = [
  { do = "fade", ambient_color = [0, 0, 0, 0.01] },
]

# ステージの前の文と背景（doc/ステージ形式の設計.md 7 章。tools/stage_convert/convert_story_text.py で 0-3.intro から変換した）
[intro]
sound = "0-3-intro"

[[intro.layer]]
image = "noise.jpg"
scale = { from = 1.6, to = 3, speed = 0.0001 }
# 回転は付けない : 以前の layer-rotate 0 180 0.1 は名前違いで 2013-08 から回っていなかった。その見た目を保つ（2026-11-11 利用者の決定）

# ステージの後の文と背景（doc/ステージ形式の設計.md 7 章。tools/stage_convert/convert_story_text.py で 0-3.outro から変換した）
[outro]
sound = "0-3-outro"

[[outro.layer]]
image = "noise.jpg"
scale = { from = 1.6, to = 3, speed = 0.0001 }
# 回転は付けない : 以前の layer-rotate 0 180 0.1 は名前違いで 2013-08 から回っていなかった。その見た目を保つ（2026-11-11 利用者の決定）
