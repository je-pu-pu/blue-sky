# 2-1 のステージ（tools/stage_convert/convert_stage.py で 2-1.stage から変換した）
format = 1

[stage]
collision = "2-1.obj"
ground = "ground"

[player]
position = [0.0, 101.0, -88.0]
camera_direction = 60

[goal]
position = [0.0, 110.0, -40.0]

[[object]]
type = "static"
name = "bg"
model = "stage-2-1"
position = [0, 0, 0]

[[event]]
when = "start"
then = [
  { do = "set", bgm = "env" },
  { do = "set", sky_box = "3" },
]

[[object]]
type = "stone"
position = [3.1853175163269043, 99.00005340576172, -56.05538558959961]
direction = 0

[[object]]
type = "stone"
positions = [
  [6.185317516326904, 99.00005340576172, -56.05538558959961],
  [2.2804641723632812, 99.00003814697266, -64.2720947265625],
  [3.0526764392852783, 99.00003814697266, -62.49936294555664],
  [5.534002780914307, 99.00004577636719, -62.810699462890625],
  [-4.305387020111084, 98.99999237060547, -60.75090789794922],
  [-3.625433921813965, 99.0, -61.940826416015625],
]
direction = 0

[[object]]
type = "medal"
position = [8.0, 105.0, -89.0]
direction = 0

[[object]]
type = "stone"
position = [-2.916842460632324, 99.0, -60.77519226074219]
direction = 0

[[object]]
type = "girl"
position = [0.0, 99.0, -45.0]
direction = 180

# 初期化
[[event]]
when = "start"
then = [
  { do = "set_animation_speed", target = "girl", speed = 0.5 },
  { do = "play_animation", target = "girl", name = "Stand", force = false, loop = true },
  { do = "turn_to", target = "girl", face = "player", speed = 1 },

  # 少女は常に所定の位置へ
  { do = "move_to", target = "girl", position = [0.0, 99.0, -45.0], speed = 10, every = 1, count = 99999 },

  { do = "load_sound", name = "fin", file = "today-and-tomorrow-b", replace = true },
]

# -----
# 手前のビルのスイッチ
# スイッチ A
[[object]]
type = "switch"
name = "switch-a"
position = [1.0, 99.0, -79.0]
direction = 180
on_turn_on = [
  { do = "play_sound", sound = "boku-switch-2" },
  { do = "play_sound", sound = "girl-damage-1" },
  { do = "switch", target = "switch-a", state = "broken" },
]

# スイッチ B
[[object]]
type = "switch"
name = "switch-b"
position = [-1.0, 99.0, -81.0]
direction = 180
on_turn_on = [
  { do = "play_sound", sound = "boku-switch-1" },
  { do = "play_sound", sound = "girl-damage-2" },
  { do = "switch", target = "switch-b", state = "broken" },
]

# -----
# 中央のビルのスイッチ
# スイッチ C
[[object]]
type = "switch"
name = "switch-c"
position = [1.0, 99.0, -61.0]
direction = 180
on_turn_on = [
  { do = "set", paper_type = 4 },
  { do = "set", drawing_accent_scale = 5 },
  { do = "fade", ambient_color = [1, 1, 1, 1] },
  { do = "fade", ambient_color = [0.5, 0.5, 0.5, 1] },
  { do = "set", sky_box = "moon" },
]

# 手前ビルから中央ビルの間の透明スイッチ
[[object]]
type = "area-switch"
name = "area-switch-a"
position = [0.0, 99.0, -70.5]
size = [2.0, 2.0, 2.0]
on_turn_on = [
  { do = "set", line_type = 2 },
  { do = "set", shadow_color = [0, 0, 0, 1] },
  { do = "play_sound", sound = "boku-switch-mienai-koremo" },
  { do = "play_sound", sound = "switch-on" },
  { do = "switch", target = "area-switch-a", state = "broken" },
]

