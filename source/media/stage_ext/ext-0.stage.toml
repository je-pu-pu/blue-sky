  [-7.0, 53.0, -7.0],
  [-10.0, 18.0, 0.0],
  [7.0, 42.0, -7.0],
  [0.0, 47.0, -10.0],
  [0.0, 60.0, 0.0],
  [0.0, 100.0, 24.0],
  [0.0, 100.0, 27.0],
  [0.0, 100.0, 30.0],
]
