# 2-2 のステージ（tools/stage_convert/convert_stage.py で 2-2.stage から変換した）
format = 1

[stage]
collision = "2-2.obj"
ground = "ground"

[player]
position = [0.0, 101.0, -47.0]
camera_direction = 60

[goal]
position = [0.0, 10.0, -40.0]

[[object]]
type = "static"
model = "stage-2-2"
position = [0, 0, 0]

[[event]]
when = "start"
then = [
  { do = "set", bgm = "bokuha-dare-nandaro" },
  { do = "set", sky_box = "sky" },
]

[[object]]
type = "static"
model = "soda-can-1"
position = [1.0, 99.0, -30.100000381469727]
rotation = [0, 0, 0]

[[object]]
type = "medal"
position = [-7.0, 101.0, -47.0]
direction = 0

[[object]]
type = "static"
model = "soda-can-1"
position = [0.0, 0.0, 0.0]
rotation = [0, 0, 0]

# プレイヤーの足場ラインを表示しない
[[event]]
when = "start"
then = [
  { do = "set_visible", target = "player", model = true, line = false },
]

# 準備
[[object]]
type = "area-switch"
position = [0.0, 90.0, -40.0]
size = [100.0, 4.0, 100.0]
on_turn_on = [
  { do = "load_sound", name = "fall", file = "silence", replace = true },
  { do = "fade", shadow_color = [1, 1, 1, 1], speed = 0.01 },
]

# 地面
[[object]]
type = "area-switch"
position = [0.0, 0.0, -40.0]
size = [100.0, 1.0, 100.0]
on_turn_on = [
  { do = "end_stage" },
]
