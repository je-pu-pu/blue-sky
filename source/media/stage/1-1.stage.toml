position = [-1.399999976158142, 0.0, 0.6000000238418579]
direction = 0

[[object]]
type = "static"
name = "wall-1"
model = "wall-3"
position = [0.0, 1.0, 0.0]
rotation = [0, 0, 0]

[[object]]
type = "static"
name = "wall-2"
model = "wall-3"
position = [-1.2, 1.0, -9.5]
rotation = [90, 0, 0]

# ゴール用スイッチ
[[object]]
type = "switch"
name = "switch-a"
position = [3.5999999046325684, 0.0, -7.0]
direction = 0
on_turn_on = [
  { do = "move_to", target = "wall-1", position = [0, 4, 0], speed = 1 },
  { do = "move_to", target = "wall-2", position = [-1.2, 4, -9.5], speed = 1 },
  { do = "play_sound", sound = "machine-translation" },
  { do = "switch", target = "switch-a", state = "off", delay = 5 },
]

[[object]]
type = "switch"
name = "switch-b"
position = [-4.0, 0.0, -10.0]
direction = 0
on_turn_on = [
  { do = "move_to", target = "wall-2", position = [-1.2, 4, -9.5], speed = 1 },
  { do = "play_sound", sound = "machine-translation" },
  { do = "switch", target = "switch-b", state = "off", delay = 5 },
]

# 浮き上がり防止
[[event]]
when = "start"
then = [
  { do = "set_body", target = "goal", gravity = [0, -9.8, 0] },
]

# キネマティックに設定
# exec game_object.set_kinematic wall-1 1
# exec game_object.set_kinematic wall-2 1

# ステージの前の文と背景（doc/ステージ形式の設計.md 7 章。tools/stage_convert/convert_story_text.py で 1-1.intro から変換した）
[intro]
sound = "1-1-intro"

[[intro.layer]]
image = "noise.jpg"
scale = { from = 1.6, to = 3, speed = 0.0001 }
# 回転は付けない : 以前の layer-rotate 0 180 0.1 は名前違いで 2013-08 から回っていなかった。その見た目を保つ（2026-11-11 利用者の決定）

# ステージの後の文と背景（doc/ステージ形式の設計.md 7 章。tools/stage_convert/convert_story_text.py で 1-1.outro から変換した）
[outro]
sound = "1-1-outro"

[[outro.layer]]
image = "noise.jpg"
scale = { from = 1.6, to = 3, speed = 0.0001 }
# 回転は付けない : 以前の layer-rotate 0 180 0.1 は名前違いで 2013-08 から回っていなかった。その見た目を保つ（2026-11-11 利用者の決定）
