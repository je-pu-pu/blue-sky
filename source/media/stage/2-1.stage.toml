# -----
# ゴール移動用スイッチ
[[object]]
type = "switch"
name = "switch-m"
position = [0, 99.0, -46.0]
on_turn_on = [

  # ゴールを移動させる
  { do = "move_to", target = "goal", position = [0.0, 99.0, -40.0], speed = 1 },

  # 少女の断末魔
  { do = "stop_all_sounds" },
  { do = "play_sound", sound = "girl-damage-5" },

  # 映像演出
  { do = "fade", shadow_color = [1, 0, 0, 1] },
  { do = "fade", shadow_paper_color = [0, 0, 0, 0] },
  { do = "fade", light_position = [-100, 100, 20] },
  { do = "set", line_type = 1 },
  { do = "set", paper_type = 1 },

  # 神を消す
  { do = "set_visible", target = "girl", model = false, line = false, delay = 5 },

  # 5 秒後に普通に戻る
  { do = "set", sky_box = "3", delay = 5 },
  { do = "set", bgm = "road", delay = 5 },
  { do = "set", ambient_color = [1, 1, 1, 1], delay = 5 },
  { do = "fade", shadow_color = [0.25, 0.25, 0.75, 1], delay = 5 },
  { do = "fade", shadow_paper_color = [0, 0, 0, 0], delay = 5 },
  { do = "fade", light_position = [-100, 100, 20], delay = 5 },
  { do = "set", line_type = 0, delay = 5 },
  { do = "set", paper_type = 0, delay = 5 },
  { do = "set", drawing_accent_scale = 0, delay = 5 },


  # 念のため 5 秒後にもゴールを移動させる
  { do = "move_to", target = "goal", position = [0.0, 99.0, -40.0], speed = 1, delay = 5 },

  # 全てのスイッチを壊す
  { do = "switch", target = "switch-a", state = "broken" },
  { do = "switch", target = "switch-b", state = "broken" },
  { do = "switch", target = "switch-c", state = "broken" },
  { do = "switch", target = "switch-d", state = "broken" },
  { do = "switch", target = "switch-e", state = "broken" },
  { do = "switch", target = "switch-f", state = "broken" },
  { do = "switch", target = "switch-g", state = "broken" },
  { do = "switch", target = "switch-h", state = "broken" },
  { do = "switch", target = "switch-i", state = "broken" },
  # 変換で捨てた : event turn-on game_object.action switch-j break（switch-j という名前の物体は無い）
  { do = "switch", target = "switch-k", state = "broken" },
  { do = "switch", target = "switch-l", state = "broken" },
  { do = "switch", target = "switch-m", state = "broken" },
  { do = "switch", target = "area-switch-a", state = "broken" },
]
