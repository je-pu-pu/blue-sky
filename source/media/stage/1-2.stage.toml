# 1-2 のステージ（tools/stage_convert/convert_stage.py で 1-2.stage から変換した）
format = 1

[stage]
collision = "1-2.obj"
ground = "ground"

[player]
position = [-16.0, 1.0, 16.0]
camera_direction = 180

[goal]
position = [0.0, 0.0, 55.0]

[[object]]
type = "static"
model = "stage-1-2"
position = [0, 0, 0]

[[event]]
when = "start"
then = [
  { do = "set", bgm = "twinkle" },
  { do = "set", sky_box = "star-2" },

  { do = "set", shadow_color = [0.5, 0.5, 0.5, 1] },
  { do = "set", shadow_paper_color = [1, 1, 1, 1] },
]

# 移動する壁に名前をつける
[[object]]
type = "static"
name = "wall"
model = "wall-3"
position = [0.0, 0.0, 49.3]
rotation = [0, 0, 0]

[[object]]
type = "stone"
position = [-14.5, 0.0, 17.399999618530273]
direction = 0

[[object]]
type = "stone"
positions = [
  [-15.19999885559082, 0.0, 19.400001525878906],
  [-14.799999237060547, 0.0, 19.700000762939453],
  [-14.399999618530273, 0.0, 19.200000762939453],
]
direction = 0

# 手前の 2 体に名前をつける
[[object]]
type = "robot"
name = "robot-a"
position = [5.0, 0.0, 20.0]
direction = 180

[[object]]
type = "robot"
name = "robot-b"
position = [-3.0, 0.0, 20.0]
direction = 180

[[object]]
type = "robot"
position = [5.0, 0.0, 28.0]
direction = 0

[[object]]
type = "robot"
positions = [
  [5.0, 0.0, 36.0],
  [5.0, 0.0, 38.0],
  [5.0, 0.0, 40.0],
  [-3.0, 0.0, 40.0],
  [-3.0, 0.0, 38.0],
  [-3.0, 0.0, 36.0],
  [-3.0, 0.0, 28.0],
]
direction = 0

[[object]]
type = "stone"
position = [-15.0, 0.0, 19.0]
direction = 0

[[object]]
type = "medal"
position = [5.0, 4.0, 45.0]
direction = 0

# スイッチの設定
[[object]]
type = "switch"
position = [5.6, 0.0, 45]
direction = 270
on_turn_on = [
  { do = "move_to", target = "wall", position = [0.0, 4, 49.3], speed = 0.25 },
  { do = "play_sound", sound = "machine-translation-long" },
]

# 手前の 2 体を回転モードにする
[[event]]
when = "start"
then = [
  { do = "set_mode", target = "robot-a", mode = "rotation" },
  { do = "set_mode", target = "robot-b", mode = "rotation" },

  # 死ぬ前に鳴っていたサウンドを止める
  { do = "stop_sound", sound = "machine-translation-long" },
]

# ステージの前の文と背景（doc/ステージ形式の設計.md 7 章。tools/stage_convert/convert_story_text.py で 1-2.intro から変換した）
[intro]
sound = "1-2-intro"

[[intro.layer]]
image = "noise.jpg"
scale = { from = 1.6, to = 3, speed = 0.0001 }
# 回転は付けない : 以前の layer-rotate 0 180 0.1 は名前違いで 2013-08 から回っていなかった。その見た目を保つ（2026-11-11 利用者の決定）

# ステージの後の文と背景（doc/ステージ形式の設計.md 7 章。tools/stage_convert/convert_story_text.py で 1-2.outro から変換した）
[outro]
sound = "1-2-outro"

[[outro.layer]]
image = "noise.jpg"
scale = { from = 1.6, to = 3, speed = 0.0001 }
# 回転は付けない : 以前の layer-rotate 0 180 0.1 は名前違いで 2013-08 から回っていなかった。その見た目を保つ（2026-11-11 利用者の決定）
