# 2-3 のステージ（tools/stage_convert/convert_stage.py で 2-3.stage から変換した）
format = 1

[stage]
bgm_loop = false

[player]
position = [0, 25, 0]

[goal]
position = [0, 25, 50]

# 変換で捨てた行（どこも読まない）: video.shadow-map-enabled 0

[[event]]
when = "start"
then = [
  { do = "set", sky_box = "sky" },
  { do = "set", bgm = "my-takeoff" },
  { do = "set", shading_enabled = false },
]

[[object]]
type = "girl"
position = [-5, 20, 25]
direction = 180

[[object]]
type = "robot"
name = "robot"
position = [5, 20, 25]

[[event]]
when = "start"
then = [
  { do = "set_flicker", target = "player", scale = 10 },
  { do = "set_flicker", target = "girl", scale = 10 },
  { do = "set_flicker", target = "robot", scale = 10 },

  { do = "set_mode", target = "robot", mode = "float" },
  { do = "set_mode", target = "girl", mode = "float" },
  { do = "set_animation_speed", target = "girl", speed = 0.5 },
  { do = "play_animation", target = "girl", name = "Float", force = false, loop = true },
  { do = "turn_to", target = "girl", face = "player", speed = 1 },
  { do = "start_flickering" },
  { do = "set_visible", target = "player", model = false, line = false },
]

[[object]]
type = "medal"
position = [25, 25, 50]

