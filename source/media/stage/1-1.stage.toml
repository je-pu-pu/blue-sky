# 1-1 のステージ（tools/stage_convert/convert_stage.py で 1-1.stage から変換した）
format = 1

[stage]
collision = "1-1.obj"
ground = "ground"

[player]
position = [-10.0, 1.0, -49.0]
camera_direction = 180

[goal]
position = [0.699999988079071, 0.0, 5.099999904632568]

[[object]]
type = "static"
model = "stage-1-1"
position = [0, 0, 0]

[[event]]
when = "start"
then = [
  { do = "set", bgm = "twinkle" },
  { do = "set", sky_box = "star-2" },
  # exec set_line_type 4
  # exec set_paper_type 4
  # exec set_drawing_accent_scale 0.1

  { do = "set", shadow_color = [0.5, 0.5, 0.5, 1] },
  { do = "set", shadow_paper_color = [1, 1, 1, 1] },
]

[[object]]
