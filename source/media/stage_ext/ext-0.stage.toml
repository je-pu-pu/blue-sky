# 全てのロケットを宙に浮かす
[[event]]
when = "start"
then = [
  { do = "set_body", target = "rocket-a", gravity = [0, 0, 0] },
  { do = "set_body", target = "rocket-b", gravity = [0, 0, 0] },
  { do = "set_body", target = "rocket-c", gravity = [0, 0, 0] },
  { do = "set_body", target = "rocket-d", gravity = [0, 0, 0] },
  { do = "set_body", target = "rocket-e", gravity = [0, 0, 0] },
  { do = "set_body", target = "rocket-f", gravity = [0, 0, 0] },
  { do = "set_body", target = "rocket-g", gravity = [0, 0, 0] },
  { do = "set_body", target = "rocket-h", gravity = [0, 0, 0] },

  # 全てのロケットの反発をなくす
  { do = "set_body", target = "rocket-a", contact_response = false },
  { do = "set_body", target = "rocket-b", contact_response = false },
  { do = "set_body", target = "rocket-c", contact_response = false },
  { do = "set_body", target = "rocket-d", contact_response = false },
  { do = "set_body", target = "rocket-e", contact_response = false },
  { do = "set_body", target = "rocket-f", contact_response = false },
  { do = "set_body", target = "rocket-g", contact_response = false },
  { do = "set_body", target = "rocket-h", contact_response = false },
]
